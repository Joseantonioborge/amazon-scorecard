<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMAZON FBA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #0f0f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Helvetica Neue', sans-serif;
    }

    h1 {
      color: #ffffff;
      font-size: 1rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 60px;
      opacity: 0.4;
    }

    .proyectos {
      display: flex;
      gap: 80px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .proyecto a {
      display: block;
      padding: 40px 50px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .proyecto a:hover {
      background: #222222;
      border-color: #555;
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .proyecto img {
      height: 60px;
      width: auto;
      display: block;
      filter: brightness(1);
      transition: filter 0.3s ease;
    }

    .proyecto a:hover img {
      filter: brightness(1.2);
    }

    .separator {
      width: 1px;
      height: 80px;
      background: #2a2a2a;
      align-self: center;
    }

    .erp-card a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 160px;
    }

    .erp-card a:hover {
      border-color: #FF9900 !important;
      box-shadow: 0 20px 40px rgba(255,153,0,0.15) !important;
    }

    .erp-logo {
      width: 56px;
      height: 56px;
      background: #FF9900;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
      color: #000;
      letter-spacing: 1px;
    }

    .erp-label {
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.7;
      text-align: center;
    }

    .erp-card a:hover .erp-label {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .separator { display: none; }
      .proyectos { gap: 24px; }
    }
  </style>
</head>
<body>

  <h1>Amazon FBA · Panel Principal</h1>

  <div class="proyectos">

    <div class="proyecto erp-card">
      <a href="./erp/index.html">
        <div class="erp-logo">ERP</div>
        <div class="erp-label">Gestión de Lanzamientos</div>
      </a>
    </div>

    <div class="separator"></div>

    <div class="proyecto">
      <a href="./FEBRERO/index.html">
        <img src="./FEBRERO.png" alt="FEBRERO">
      </a>
    </div>

    <div class="proyecto">
      <a href="./MARZO/index.html">
        <img src="./MARZO.png" alt="MARZO">
      </a>
    </div>

    <div class="proyecto">
      <a href="./MARZO II/index.html">
        <img src="./MARZO II.png" alt="MARZO II">
      </a>
    </div>

  <div class="proyecto">
      <a href="./MARZO III/index.html">
        <img src="./MARZO III.png" alt="MARZO III">
      </a>
    </div>

<div class="proyecto">
      <a href="./MARZO IV/index.html">
        <img src="./MARZO IV.png" alt="MARZO IV">
      </a>
    </div>

<div class="proyecto">
      <a href="./ABRIL/index.html">
        <img src="./ABRIL.png" alt="ABRIL">
      </a>
    
  </div>

</body>
</html>
